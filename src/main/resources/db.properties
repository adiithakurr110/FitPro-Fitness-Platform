# ===================================================================
# FitPro Relational Database Configuration
# ===================================================================
# Active database type: h2 (embedded zero-setup default) or mysql (external MySQL)
# Override via environment variable DB_TYPE
db.type=h2

# Embedded H2 Configuration (Default for development, testing, and evaluation)
# Persists data to ./data/fitpro_db.mv.db
db.h2.url=jdbc:h2:./data/fitpro_db;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
db.h2.user=sa
db.h2.password=

# External MySQL Configuration (Used when db.type=mysql)
# Override with environment variables: DB_URL, DB_USER, DB_PASSWORD
db.mysql.driver=com.mysql.cj.jdbc.Driver
db.mysql.url=jdbc:mysql://localhost:3306/fitpro?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
db.mysql.user=
db.mysql.password=
